<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Herní mapa</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{
margin:0;
}

#map{
height:100vh;
width:100%;
}
</style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

// velikost mapy (musí odpovídat obrázku)
var width = 1 920;
var height = 1 923;

// vytvoření mapy
var map = L.map('map', {
crs: L.CRS.Simple,
minZoom: -2
});

// souřadnice obrázku
var bounds = [[0,0],[height,width]];

// vložení obrázku mapy
var image = L.imageOverlay('hordetesting_latest.webp', bounds).addTo(map);

// přizpůsobení mapy
map.fitBounds(bounds);

// příklad bodu
var marker = L.marker([2000,2000]).addTo(map);
marker.bindPopup("Spawn");

</script>

</body>
</html>
