<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Herní mapa</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  display: flex;
  height: 100vh;
}

#map {
  flex: 1;
  height: 100vh;
}

/* Boční panely */
.side-panel {
  width: 300px;
  background: #f5f5f5;
  border-left: 1px solid #ddd;
  overflow-y: auto;
  padding: 15px;
  box-shadow: -2px 0 5px rgba(0,0,0,0.1);
}

.panel-section {
  margin-bottom: 20px;
}

.panel-section h3 {
  background: #333;
  color: white;
  padding: 10px;
  border-radius: 3px;
  margin-bottom: 10px;
  font-size: 14px;
}

.form-group {
  margin-bottom: 10px;
}

label {
  display: block;
  margin-bottom: 5px;
  font-weight: bold;
  font-size: 12px;
}

input[type="text"],
input[type="number"],
input[type="color"],
select {
  width: 100%;
  padding: 8px;
  border: 1px solid #ccc;
  border-radius: 3px;
  font-size: 12px;
}

button {
  width: 100%;
  padding: 10px;
  background: #4CAF50;
  color: white;
  border: none;
  border-radius: 3px;
  cursor: pointer;
  font-size: 12px;
  margin-bottom: 5px;
}

button:hover {
  background: #45a049;
}

button.danger {
  background: #f44336;
}

button.danger:hover {
  background: #da190b;
}

.marker-list {
  font-size: 12px;
}

.marker-item {
  background: white;
  padding: 8px;
  margin-bottom: 5px;
  border-left: 3px solid #4CAF50;
  border-radius: 2px;
  cursor: pointer;
}

.marker-item:hover {
  background: #f0f0f0;
}

.marker-item.custom {
  border-left-color: #2196F3;
}

.marker-delete {
  float: right;
  color: red;
  cursor: pointer;
  font-weight: bold;
}

.status {
  background: #e3f2fd;
  border-left: 3px solid #2196F3;
  padding: 10px;
  border-radius: 2px;
  font-size: 12px;
  margin-bottom: 10px;
}

.status.error {
  background: #ffebee;
  border-left-color: #f44336;
}

.status.success {
  background: #e8f5e9;
  border-left-color: #4CAF50;
}

.info {
  padding: 6px 8px;
  background: white;
  box-shadow: 0 0 15px rgba(0,0,0,0.2);
  border-radius: 5px;
  font-size: 14px;
}
</style>
</head>

<body>

<div id="map"></div>

<div class="side-panel">
  <!-- Status sekce -->
  <div class="panel-section">
    <div id="status" class="status">
      <strong>Status:</strong> Iniciální...
    </div>
    <div id="position" style="font-size: 12px; color: #666;">
      <strong>Tvoje pozice:</strong> -
    </div>
  </div>

  <!-- Přidat nový marker -->
  <div class="panel-section">
    <h3>➕ Přidat Marker</h3>
    <div class="form-group">
      <label>Název:</label>
      <input type="text" id="markerName" placeholder="Např. Bedna, NPC...">
    </div>
    <div class="form-group">
      <label>Typ:</label>
      <select id="markerType">
        <option value="default">Normální</option>
        <option value="treasure">Poklad 💎</option>
        <option value="npc">NPC 👤</option>
        <option value="danger">Nebezpečí ⚠️</option>
      </select>
    </div>
    <div class="form-group">
      <label>Barva:</label>
      <input type="color" id="markerColor" value="#2196F3">
    </div>
    <button onclick="enableMarkerDrawing()">Klikni na mapu</button>
    <small style="color: #666; display: block; margin-top: 5px;">Klikni na mapu a vytvořím marker</small>
  </div>

  <!-- Seznam markerů -->
  <div class="panel-section">
    <h3>📍 Markery</h3>
    <div id="markerList" class="marker-list">
      <div style="color: #999;">Zatím žádné...</div>
    </div>
  </div>

  <!-- Spawn Point -->
  <div class="panel-section">
    <h3>🎯 Spawn Point</h3>
    <div style="font-size: 12px; color: #666; margin-bottom: 10px;">
      Pozice: <strong>[961.5, 960]</strong>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
// Konfigurace
const CONFIG = {
  mapWidth: 1920,
  mapHeight: 1923,
  updateInterval: 10000, // 10 sekund
  serverUrl: 'http://localhost:3000' // Změň na svůj server
};

// Globální proměnné
let map;
let customMarkers = {};
let markerDrawingMode = false;
let pendingMarkerData = null;
let playerMarker = null;

// ============ INICIALIZACE MAPY ============
function initMap() {
  map = L.map('map', {
    crs: L.CRS.Simple,
    minZoom: -2,
    maxZoom: 3
  });

  const bounds = [[0, 0], [CONFIG.mapHeight, CONFIG.mapWidth]];
  L.imageOverlay('mapa.jpg', bounds).addTo(map);
  map.fitBounds(bounds);

  // Spawn Point
  const spawnMarker = L.marker([961.5, 960], {
    icon: L.icon({
      iconUrl: 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjQiIGhlaWdodD0iMjQiIHZpZXdCb3g9IjAgMCAyNCAyNCI+PGNpcmNsZSBjeD0iMTIiIGN5PSIxMiIgcj0iMTAiIGZpbGw9IiNGRkMzMDAiIHN0cm9rZT0iIzMzMyIgc3Ryb2tlLXdpZHRoPSIyIi8+PC9zdmc+',
      iconSize: [24, 24],
      iconAnchor: [12, 12],
      popupAnchor: [0, -12]
    })
  }).addTo(map);
  spawnMarker.bindPopup("<b>Spawn Point</b><br>Počáteční pozice");
  spawnMarker.bindTooltip("Spawn", {permanent: false});

  // Tvůj player marker
  playerMarker = L.marker([961.5, 960], {
    icon: L.icon({
      iconUrl: 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjQiIGhlaWdodD0iMjQiIHZpZXdCb3g9IjAgMCAyNCAyNCI+PGNpcmNsZSBjeD0iMTIiIGN5PSIxMiIgcj0iOCIgZmlsbD0iIzQyQTVGNSIgc3Ryb2tlPSJ3aGl0ZSIgc3Ryb2tlLXdpZHRoPSIyIi8+PC9zdmc+',
      iconSize: [24, 24],
      iconAnchor: [12, 12],
      popupAnchor: [0, -12]
    })
  }).addTo(map);
  playerMarker.bindPopup("<b>Tvoje pozice</b>");
  playerMarker.bindTooltip("Ty", {permanent: true});

  // Klikání na mapu
  map.on('click', function(e) {
    if (markerDrawingMode) {
      createMarkerAtPosition(e.latlng);
      markerDrawingMode = false;
    } else {
      showCoordinates(e.latlng);
    }
  });
}

// ============ MARKERY ============
function enableMarkerDrawing() {
  const name = document.getElementById('markerName').value.trim();
  if (!name) {
    showStatus('Vyplň název markeru!', 'error');
    return;
  }

  pendingMarkerData = {
    name: name,
    type: document.getElementById('markerType').value,
    color: document.getElementById('markerColor').value
  };

  markerDrawingMode = true;
  showStatus('Klikni na mapu pro přidání markeru', 'success');
}

function createMarkerAtPosition(latlng) {
  if (!pendingMarkerData) return;

  const id = Date.now();
  const data = {
    ...pendingMarkerData,
    lat: Math.round(latlng.lat * 10) / 10,
    lng: Math.round(latlng.lng * 10) / 10,
    id: id
  };

  customMarkers[id] = data;

  // Vytvoř marker na mapě
  const marker = L.marker([data.lat, data.lng], {
    icon: L.icon({
      iconUrl: 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjQiIGhlaWdodD0iMzIiIHZpZXdCb3g9IjAgMCAyNCAzMiIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMjQiIGhlaWdodD0iMzIiIGZpbGw9IiMyMTk2RjMiIHJ4PSI0Ii8+PC9zdmc+',
      iconSize: [24, 32],
      iconAnchor: [12, 32],
      popupAnchor: [0, -32]
    })
  }).addTo(map);

  marker.bindPopup(`<b>${data.name}</b><br>Typ: ${data.type}<br>[${data.lat}, ${data.lng}]`);
  marker.bindTooltip(data.name, {permanent: false});
  marker.customDataId = id;

  // Pošli na server
  sendMarkerToServer(data);
  
  // Aktualizuj seznam
  updateMarkerList();
  
  // Vynuluj formulář
  document.getElementById('markerName').value = '';
  pendingMarkerData = null;
  showStatus('Marker přidán! ✓', 'success');
}

function deleteMarker(id) {
  const marker = map._layers;
  for (let key in marker) {
    if (marker[key].customDataId === id) {
      map.removeLayer(marker[key]);
      break;
    }
  }
  
  delete customMarkers[id];
  updateMarkerList();
  showStatus('Marker odstraněn', 'success');
}

function updateMarkerList() {
  const list = document.getElementById('markerList');
  const items = Object.entries(customMarkers);

  if (items.length === 0) {
    list.innerHTML = '<div style="color: #999;">Zatím žádné vlastní markery...</div>';
    return;
  }

  list.innerHTML = items.map(([id, marker]) => `
    <div class="marker-item custom" onclick="focusMarker(${id})">
      <div><strong>${marker.name}</strong></div>
      <small>${marker.type} | [${marker.lat}, ${marker.lng}]</small>
      <span class="marker-delete" onclick="event.stopPropagation(); deleteMarker(${id})">✕</span>
    </div>
  `).join('');
}

function focusMarker(id) {
  const marker = customMarkers[id];
  if (marker) {
    map.setView([marker.lat, marker.lng], 1);
  }
}

function showCoordinates(latlng) {
  L.popup()
    .setLatLng(latlng)
    .setContent(`Souřadnice: [${Math.round(latlng.lat * 10) / 10}, ${Math.round(latlng.lng * 10) / 10}]`)
    .openOn(map);
}

// ============ KOMUNIKACE SE SERVEREM ============
async function fetchPlayerPosition() {
  try {
    const response = await fetch(`${CONFIG.serverUrl}/api/position`);
    if (!response.ok) throw new Error('Chyba serveru');
    
    const data = await response.json();
    
    // Aktualizuj player marker
    playerMarker.setLatLng([data.lat, data.lng]);
    
    // Aktualizuj display
    document.getElementById('position').innerHTML = 
      `<strong>Tvoje pozice:</strong> [${data.lat}, ${data.lng}]`;
    
    showStatus('Pozice aktualizována ✓', 'success');
  } catch (error) {
    showStatus(`Chyba: ${error.message}`, 'error');
  }
}

async function sendMarkerToServer(markerData) {
  try {
    const response = await fetch(`${CONFIG.serverUrl}/api/markers`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(markerData)
    });
    
    if (!response.ok) throw new Error('Chyba při ukládání');
    
    console.log('Marker uložen na server');
  } catch (error) {
    console.error('Chyba:', error);
    showStatus(`Chyba ukládání: ${error.message}`, 'error');
  }
}

// ============ UI FUNKCE ============
function showStatus(message, type = 'info') {
  const status = document.getElementById('status');
  status.textContent = message;
  status.className = 'status ' + type;
  
  if (type !== 'error') {
    setTimeout(() => {
      status.textContent = 'Status: Připraveno';
      status.className = 'status';
    }, 3000);
  }
}

// ============ INICIALIZACE ============
window.addEventListener('DOMContentLoaded', () => {
  initMap();
  
  // Aktualizuj pozici každých 10 sekund
  fetchPlayerPosition();
  setInterval(fetchPlayerPosition, CONFIG.updateInterval);
});

</script>

</body>
</html>
