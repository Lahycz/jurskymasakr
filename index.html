<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Moje herní mapa</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{
margin:0;
}

#map{
height:100vh;
width:100%;
}
</style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

var map = L.map('map').setView([50.0755,14.4378],13);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
maxZoom:19
}).addTo(map);

var marker = L.marker([50.0755,14.4378]).addTo(map);

marker.bindPopup("Startovní bod");

</script>

</body>
</html>

L.marker([50.08,14.42]).addTo(map)
.bindPopup("Spawn jídla");

L.marker([50.06,14.44]).addTo(map)
.bindPopup("Hnízdo");
